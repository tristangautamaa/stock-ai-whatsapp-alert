name: Morning Brief

on:
  schedule:
    - cron: '50 23 * * 0-4'
  workflow_dispatch:

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-render.txt

      - name: Run morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_PROVIDER: email
          EMAIL_RECIPIENT: tristangautamaa@gmail.com
          DRY_RUN: false
          MARKET_DATA_PROVIDER: yfinance
        run: python -m src.report.send_brief
