services:
  - type: cron
    name: goldman-stanley-morning-brief
    runtime: python
    schedule: "50 23 * * 0-4"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.report.send_brief
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: email
      - key: EMAIL_RECIPIENT
        value: tristangautamaa@gmail.com
      - key: DRY_RUN
        value: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance
